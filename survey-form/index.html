<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>

    <!-- Link External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Survey Form</h1>
        <p>Please fill out this form. We value your feedback!</p>

        <form>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" placeholder="Your age" min="10" max="100">
            </div>

            <div class="form-group">
                <label>How did you hear about us?</label>
                <select>
                    <option value="">-- Select --</option>
                    <option>Social Media</option>
                    <option>Friend</option>
                    <option>Search Engine</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Would you recommend us?</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="recommend" value="yes">
                        Yes
                    </label>

                    <label>
                        <input type="radio" name="recommend" value="no">
                        No
                    </label>

                    <label>
                        <input type="radio" name="recommend" value="maybe">
                        Maybe
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>What do you like? (Select all)</label>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox">
                        UI Design
                    </label>

                    <label>
                        <input type="checkbox">
                        Performance
                    </label>

                    <label>
                        <input type="checkbox">
                        Support
                    </label>

                    <label>
                        <input type="checkbox">
                        Features
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Comments</label>

                <textarea rows="4" placeholder="Write your feedback..."></textarea>
            </div>

            <button type="submit">Submit</button>

        </form>
    </div>

</body>
</html>
